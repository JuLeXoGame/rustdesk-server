name: Security dependency regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "libs/atty-compat/**"
      - "libs/scrap/examples/**"
      - "vendor/**"
      - "ui/**"
      - "tools/check_security_dependencies.py"
      - ".github/workflows/security-dependencies.yml"
  push:
    branches: ["relaisdesk/authorization"]

permissions:
  contents: read

concurrency:
  group: security-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.90.0"
      - run: python3 tools/check_security_dependencies.py
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny unsound
      - if: hashFiles('ui/Cargo.lock') != ''
        run: cargo audit --deny unsound --file ui/Cargo.lock

  native-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88.0"
      - run: cargo test --locked -p atty --lib
      - name: Test overwrite confirmation without the obsolete password dependency
        if: hashFiles('libs/scrap/examples/support/input.rs') != ''
        shell: bash
        run: |
          rustc --edition=2021 --test libs/scrap/examples/support/input.rs -o input-security-tests
          ./input-security-tests
      - name: Test optimized GLib security backport
        if: runner.os == 'Linux'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          stage=$(mktemp -d)
          cp -R vendor/glib-* "$stage/glib"
          cargo test --manifest-path "$stage/glib/Cargo.toml" --release --lib variant_str_iter
      - name: Build historical Windows UI and verify generated hash maps
        if: runner.os == 'Windows' && hashFiles('ui/Cargo.toml') != ''
        shell: bash
        run: |
          npm --prefix ui/html ci --ignore-scripts
          npm --prefix ui/html audit
          npm --prefix ui/html run build
          cargo check --locked --manifest-path ui/Cargo.toml
          cargo test --locked --manifest-path ui/Cargo.toml --test phf_security
