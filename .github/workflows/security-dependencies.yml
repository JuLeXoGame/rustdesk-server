name: Security dependency regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "libs/hbb_common"
      - "libs/atty-compat/**"
      - "libs/scrap/examples/**"
      - "vendor/**"
      - "ui/**"
      - "tools/check_security_dependencies.py"
      - ".github/workflows/security-dependencies.yml"
  push:
    branches: ["relaisdesk/authorization"]

permissions:
  contents: read

concurrency:
  group: security-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.99.1"
      - run: python3 tools/check_security_dependencies.py
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Temporary exception, reviewed by 2026-12-31 (this step fails from 2027-01-01).
      # RUSTSEC-2026-0459: SQLite < 3.54.0 bundled in libsqlite3-sys 0.30.1, pulled by
      # sqlx-sqlite 0.8.6 for hbbs. Exposure needs a database file and a -wal file
      # crafted by a third party and opened locally; hbbs only opens its own database.
      # The patched libsqlite3-sys (>= 0.39.0) is not accepted by sqlx 0.8.x yet.
      - name: Exceptions expire on 2026-12-31
        run: test "$(date -u +%Y%m%d)" -lt 20270101
      - run: cargo audit --deny unsound --ignore RUSTSEC-2026-0459
      - if: hashFiles('ui/Cargo.lock') != ''
        run: cargo audit --deny unsound --file ui/Cargo.lock

  native-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.99.1"
      - run: cargo test --locked -p atty --lib
      - name: Test overwrite confirmation without the obsolete password dependency
        if: hashFiles('libs/scrap/examples/support/input.rs') != ''
        shell: bash
        run: |
          rustc --edition=2021 --test libs/scrap/examples/support/input.rs -o input-security-tests
          ./input-security-tests
      - name: Test optimized GLib security backport
        if: runner.os == 'Linux'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          stage=$(mktemp -d)
          cp -R vendor/glib-* "$stage/glib"
          cargo test --manifest-path "$stage/glib/Cargo.toml" --release --lib variant_str_iter
      - name: Build historical Windows UI and verify generated hash maps
        if: runner.os == 'Windows' && hashFiles('ui/Cargo.toml') != ''
        shell: bash
        run: |
          npm --prefix ui/html ci --ignore-scripts
          # picomatch (via vite, a build-time devDependency) has a ReDoS advisory
          # (GHSA-fc5q-39xc-vjpf) with no patched release as of 2026-11-18. It only
          # processes the build's own glob patterns. Production dependencies stay
          # gated; the full report stays visible as a warning. Review by 2026-12-31.
          npm --prefix ui/html audit --omit=dev
          npm --prefix ui/html audit || echo "::warning::npm audit reports dev-only advisories (see exception comment)"
          npm --prefix ui/html run build
          cargo check --locked --manifest-path ui/Cargo.toml
          cargo test --locked --manifest-path ui/Cargo.toml --test phf_security
