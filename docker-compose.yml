networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
    image: relaisdesk/rustdesk-server:local
    build:
      context: .
      dockerfile: Dockerfile.relaisdesk
    command: ["hbbs", "-r", "api.relaisdesk.fr:21117"]
    environment:
      RELAISDESK_AUTH_REQUIRED: "${RELAISDESK_AUTH_REQUIRED:-Y}"
      RELAISDESK_AUTH_PUBLIC_KEYS: "${RELAISDESK_AUTH_PUBLIC_KEYS:-}"
      RELAISDESK_SOURCE_URL: "${SERVER_SOURCE_URL:?public corresponding source URL is required by AGPLv3}"
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 21117:21117
    image: relaisdesk/rustdesk-server:local
    build:
      context: .
      dockerfile: Dockerfile.relaisdesk
    command: ["hbbr"]
    environment:
      RELAISDESK_AUTH_REQUIRED: "${RELAISDESK_AUTH_REQUIRED:-Y}"
      RELAISDESK_AUTH_PUBLIC_KEYS: "${RELAISDESK_AUTH_PUBLIC_KEYS:-}"
      RELAISDESK_SOURCE_URL: "${SERVER_SOURCE_URL:?public corresponding source URL is required by AGPLv3}"
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
