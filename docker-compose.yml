networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
    image: relaisdesk/rustdesk-server:local
    build:
      context: .
      dockerfile: Dockerfile.relaisdesk
    command: ["hbbs", "-r", "api.informatiqueadomicile03.fr:21117"]
    environment:
      RELAISDESK_AUTH_REQUIRED: "Y"
      RELAISDESK_AUTH_PUBLIC_KEYS: "${RELAISDESK_AUTH_PUBLIC_KEYS:?authorization public keys are required}"
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 21117:21117
    image: relaisdesk/rustdesk-server:local
    build:
      context: .
      dockerfile: Dockerfile.relaisdesk
    command: ["hbbr"]
    environment:
      RELAISDESK_AUTH_REQUIRED: "Y"
      RELAISDESK_AUTH_PUBLIC_KEYS: "${RELAISDESK_AUTH_PUBLIC_KEYS:?authorization public keys are required}"
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
